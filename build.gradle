plugins {
	id 'org.springframework.boot' version '3.4.13'
	id 'io.spring.dependency-management' version '1.1.5'
	id 'java'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

repositories {
	mavenCentral()
	gradlePluginPortal()
}

sourceSets {
	main {
		java {
			srcDir("build/generated/source/proto/main/java")
		}
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation("org.springframework.boot:spring-boot-starter-data-jpa")
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.apache.httpcomponents.client5:httpclient5'

	implementation("club.minnced:jdave-api:0.1.8")
	implementation("club.minnced:jdave-native-linux-x86-64:0.1.8")
	implementation("club.minnced:jdave-native-win-x86-64:0.1.8")

	implementation("club.minnced:udpqueue-native-linux-x86-64:0.2.12") // adds linux 64bit
	implementation("club.minnced:udpqueue-native-win-x86-64:0.2.12") // adds windows 64bit

	implementation("com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.18.1")

	implementation 'org.apache.commons:commons-lang3'
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

	implementation("net.dv8tion:JDA:6.4.1")

	implementation("ai.picovoice:cheetah-java:4.0.2")

	implementation 'org.jfree:jfreechart:1.5.3'

	implementation 'org.mariadb.jdbc:mariadb-java-client:3.2.0'
	implementation "io.sentry:sentry-spring-boot-starter-jakarta:8.22.0"

	implementation 'jakarta.servlet:jakarta.servlet-api:6.0.0'

	implementation("org.mariadb.jdbc:mariadb-java-client:3.1.3")
	implementation("mysql:mysql-connector-java:8.0.33")

	implementation 'com.google.code.gson:gson:2.10.1'

	compileOnly("org.projectlombok:lombok")
	annotationProcessor("org.projectlombok:lombok")
}